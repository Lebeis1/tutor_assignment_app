<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Tutor Assignment System</title>
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>
    <main class="container">
        <section class="card">
            <h1>Tutor Assignment System</h1>

            <p class="introduction">
                Upload an Excel workbook containing the Tutors and
                Classes worksheets.
            </p>

            {% if error %}
                <div class="error-message">
                    {{ error }}
                </div>
            {% endif %}

            <form
                action="{{ url_for('upload_file') }}"
                method="post"
                enctype="multipart/form-data"
            >
                <label for="excel_file">
                    Select an Excel workbook
                </label>

                <input
                    type="file"
                    id="excel_file"
                    name="excel_file"
                    accept=".xlsx"
                    required
                >

                <button type="submit">
                    Upload and Validate
                </button>
            </form>

            <p class="file-requirement">
                Accepted format: .xlsx
            </p>
        </section>
    </main>
</body>
</html>
